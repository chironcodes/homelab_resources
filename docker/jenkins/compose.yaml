version: '3'
services:
  jenkins:
    container_name: jenkins
    image: jenkins-ansible
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    build:
      context: jenkins-ansible     
    ports:
      - "8081:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    volumes:
      # NOTE: If Jenkins was previously running, migrate data from the old path before restarting.
      - /home/${USER}/resources/docker/jenkins/appdata:/var/jenkins_home

