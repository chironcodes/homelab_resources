# example-app
#
# Template for a custom-built application.
# Copy this directory to docker/<your-app>/ and adapt as needed.
#
# Source code lives in: ../../apps/example-app/
# Required env vars: copy .env.example to .env and fill in values.

version: '3.8'
services:
  example-app:
    container_name: example-app
    build:
      context: ../../apps/example-app
      dockerfile: Dockerfile
    image: example-app:local
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    env_file:
      - .env
    volumes:
      - /home/${USER}/resources/docker/example-app/appdata:/app/data
    ports:
      - "8000:8000"

