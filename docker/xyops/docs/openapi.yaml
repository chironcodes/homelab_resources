  /api/app/create_plugin/v1:
    post:
      tags: [Plugins]
      summary: Create a plugin definition
      description: |
        Requires `create_plugins` privilege. `id` is auto-generated if omitted.
        `type` must be one of: `event`, `monitor`, `action`, `scheduler`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, type]
              properties:
                title:
                  type: string
                enabled:
                  type: boolean
                  default: true
                type:
                  type: string
                  enum: [event, monitor, action, scheduler]
                command:
                  type: string
                  description: Shell command to execute (use `[shell-plugin]` for inline scripts)
                script:
                  type: string
                  description: Inline shell script (used when command is `[shell-plugin]`)
                params:
                  type: array
                  items:
                    $ref: "#/components/schemas/PluginParam"
                groups:
                  type: array
                  items:
                    type: string
                format:
                  type: string
                uid:
                  type: integer
                gid:
                  type: integer
                kill:
                  type: integer
                  description: Seconds before SIGKILL after SIGTERM
                icon:
                  type: string
                notes:
                  type: string
            examples:
              node_plugin:
                summary: Node.js plugin (external command)
                value:
                  title: "API Ingest"
                  enabled: true
                  type: event
                  command: "/usr/local/bin/node /opt/xyops/plugins/api-ingest/plugin.js"
                  params:
                    - id: url
                      type: text
                      title: URL
                      value: ""
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardSuccess"
                  - type: object
                    properties:
                      plugin:
                        $ref: "#/components/schemas/Plugin"

  /api/app/update_plugin/v1:
    post:
      tags: [Plugins]
      summary: Update a plugin definition (shallow merge — send only changed fields)
      description: |
        Requires `edit_plugins` privilege. `modified` and `revision` are updated automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
                title:
                  type: string
                enabled:
                  type: boolean
                type:
                  type: string
                  enum: [event, monitor, action, scheduler]
                command:
                  type: string
                script:
                  type: string
                params:
                  type: array
                  items:
                    $ref: "#/components/schemas/PluginParam"
                groups:
                  type: array
                  items:
                    type: string
                format:
                  type: string
                uid:
                  type: integer
                gid:
                  type: integer
                kill:
                  type: integer
                icon:
                  type: string
                notes:
                  type: string
            example:
              id: "api-ingest"
              enabled: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardSuccess"

  /api/app/delete_plugin/v1:
