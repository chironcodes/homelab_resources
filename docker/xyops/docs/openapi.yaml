tags:
  - name: Alerts
    description: Alert rules based on monitor expressions
  - name: Buckets
    description: Key-value data stores with optional file attachments
  - name: Categories
    description: Event categories with limits and action hooks
  - name: Channels
    description: Notification channels (email, webhook, follow-up job)
  - name: Events
    description: Scheduled or on-demand jobs — the core workflow primitive
  - name: Files
    description: File upload and management for jobs and buckets
  - name: Groups
    description: Server groups matched by hostname pattern
  - name: Jobs
    description: Job instances created when events run
  - name: Monitors
    description: Time-series metric collectors running on worker nodes
  - name: Plugins
    description: Custom event runners, monitors, and action handlers
  - name: Roles
    description: Permission sets assigned to users
  - name: Search
    description: Cross-resource search endpoints
  - name: Servers
    description: Registered worker nodes
