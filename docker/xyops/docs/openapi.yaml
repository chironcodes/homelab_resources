openapi: 3.1.0
info:
  title: xyOps API
  version: "1"
  description: |
    REST API for xyOps workflow automation and server monitoring.

    **Base URL:** `http(s)://SERVER/api/app/NAME/v1`

    **Authentication:** All requests require either:
    - `X-API-Key` HTTP header
    - `api_key` query parameter
    - `api_key` property in the JSON body

    API keys are 24-character alphanumeric strings (case-sensitive), generated in
    the UI under **Admin → API Keys**.

    **Standard response:** Every response includes `code: 0` on success. Errors
    return a non-zero `code` and a `description` string.

servers:
  - url: http://localhost:5522
    description: Local conductor (HTTP)
  - url: https://localhost:5523
    description: Local conductor (HTTPS)

components:
  securitySchemes:
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    ApiKeyQuery:
      type: apiKey
      in: query
      name: api_key

  schemas:
    StandardSuccess:
      type: object
      properties:
        code:
          type: integer
          example: 0

    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
          example: 1
        description:
          type: string
          example: "Record not found"

    ListMeta:
      type: object
      properties:
        length:
          type: integer

    PaginationParams:
      type: object
      properties:
        offset:
          type: integer
          default: 0
        limit:
          type: integer
        sort_by:
          type: string
        sort_dir:
          type: integer
          enum: [-1, 1]

    # ── Alerts ──────────────────────────────────────────────────────────────
    Alert:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        expression:
          type: string
        message:
          type: string
        groups:
          type: array
          items:
            type: string
        email:
          type: string
        web_hook:
          type: string
        monitor_id:
          type: string
        enabled:
          type: boolean
        samples:
          type: integer
        notes:
          type: string
        modified:
          type: integer
        created:
          type: integer

    # ── Buckets ─────────────────────────────────────────────────────────────
    Bucket:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        enabled:
          type: boolean
        icon:
          type: string
        notes:
          type: string
        data:
          type: object
        modified:
          type: integer
        created:
          type: integer

    # ── Categories ──────────────────────────────────────────────────────────
    Category:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        enabled:
          type: boolean
        color:
          type: string
        icon:
          type: string
        notes:
          type: string
        limits:
          type: array
          items:
            type: object
        actions:
          type: array
          items:
            type: object

    # ── Channels ────────────────────────────────────────────────────────────
    Channel:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        enabled:
          type: boolean
        notes:
          type: string
        users:
          type: array
          items:
            type: string
        email:
          type: string
        web_hook:
          type: string
        run_event:
          type: string
        sound:
          type: string
        icon:
          type: string
        max_per_day:
          type: integer

    # ── Events ──────────────────────────────────────────────────────────────
    Event:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        enabled:
          type: boolean
        category:
          type: string
        targets:
          type: array
          items:
            type: string
        plugin:
          type: string
        params:
          type: object
        triggers:
          type: array
          items:
            type: object
        limits:
          type: object
        actions:
          type: array
          items:
            type: object
        notes:
          type: string
        icon:
          type: string
        tags:
          type: array
          items:
            type: string
        algo:
          type: string

    # ── Groups ──────────────────────────────────────────────────────────────
    Group:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        hostname_match:
          type: string
        notes:
          type: string

    # ── Jobs ────────────────────────────────────────────────────────────────
    Job:
      type: object
      properties:
        id:
          type: string
        event:
          type: string
        state:
          type: string
          enum: [queued, running, complete, failed, aborted]
        code:
          type: integer
        data:
          type: object
        table:
          type: object
        params:
          type: object
        tags:
          type: array
          items:
            type: string
        created:
          type: integer
        modified:
          type: integer

    # ── Monitors ────────────────────────────────────────────────────────────
    Monitor:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        source:
          type: string
        data_type:
          type: string
        suffix:
          type: string
        display:
          type: boolean
        min_vert_scale:
          type: number
        groups:
          type: array
          items:
            type: string
        icon:
          type: string
        notes:
          type: string

    # ── Plugins ─────────────────────────────────────────────────────────────
    PluginParam:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [text, textarea, code, checkbox, select, hidden]
        title:
          type: string
        value:
          oneOf:
            - type: string
            - type: boolean
            - type: number

    Plugin:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        enabled:
          type: boolean
        type:
          type: string
          enum: [event, monitor, action, scheduler]
        command:
          type: string
        script:
          type: string
        params:
          type: array
          items:
            $ref: "#/components/schemas/PluginParam"
        groups:
          type: array
          items:
            type: string
        format:
          type: string
        uid:
          type: integer
        gid:
          type: integer
        kill:
          type: integer
        icon:
          type: string
        notes:
          type: string
        username:
          type: string
        revision:
          type: integer
        modified:
          type: integer
        created:
          type: integer

    # ── Roles ───────────────────────────────────────────────────────────────
    Role:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        enabled:
          type: boolean
        icon:
          type: string
        notes:
          type: string
        categories:
          type: array
          items:
            type: string
        groups:
          type: array
          items:
            type: string
        privileges:
          type: object

    # ── Servers ─────────────────────────────────────────────────────────────
    Server:
      type: object
      properties:
        id:
          type: string
        hostname:
          type: string
        ip:
          type: string
        groups:
          type: array
          items:
            type: string
        notes:
          type: string
        modified:
          type: integer
        created:
          type: integer

security:
  - ApiKeyHeader: []
  - ApiKeyQuery: []

paths:
  # ════════════════════════════════════════════════════════════════
  # ALERTS
  # ════════════════════════════════════════════════════════════════
  /api/app/get_alerts/v1:
    get:
      tags: [Alerts]
      summary: List all alerts
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardSuccess"
                  - type: object
                    properties:
                      rows:
                        type: array
                        items:
                          $ref: "#/components/schemas/Alert"
                      list:
                        $ref: "#/components/schemas/ListMeta"

  /api/app/get_alert/v1:
    get:
      tags: [Alerts]
      summary: Get a single alert
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardSuccess"
                  - type: object
                    properties:
                      alert:
                        $ref: "#/components/schemas/Alert"

  /api/app/create_alert/v1:
    post:
      tags: [Alerts]
      summary: Create an alert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                expression:
                  type: string
                message:
                  type: string
                groups:
                  type: array
                  items:
                    type: string
                email:
                  type: string
                web_hook:
                  type: string
                monitor_id:
                  type: string
                enabled:
                  type: boolean
                samples:
                  type: integer
                notes:
                  type: string
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardSuccess"
                  - type: object
                    properties:
                      alert:
                        $ref: "#/components/schemas/Alert"

  /api/app/update_alert/v1:
    post:
      tags: [Alerts]
      summary: Update an alert (partial)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [id]
                  properties:
                    id:
                      type: string
                - $ref: "#/components/schemas/Alert"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardSuccess"

  /api/app/test_alert/v1:
    post:
      tags: [Alerts]
      summary: Test an alert expression against a server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [server, expression, message]
              properties:
                server:
                  type: string
                expression:
                  type: string
                message:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardSuccess"
                  - type: object
                    properties:
                      result:
                        type: boolean
                      message:
                        type: string

  /api/app/delete_alert/v1:
    post:
      tags: [Alerts]
      summary: Delete an alert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardSuccess"

  # ════════════════════════════════════════════════════════════════
  # BUCKETS
  # ════════════════════════════════════════════════════════════════
  /api/app/get_buckets/v1:
    get:
      tags: [Buckets]
      summary: List all buckets
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardSuccess"
                  - type: object
                    properties:
                      rows:
                        type: array
                        items:
                          $ref: "#/components/schemas/Bucket"
                      list:
                        $ref: "#/components/schemas/ListMeta"

  /api/app/get_bucket/v1:
    get:
      tags: [Buckets]
      summary: Get a single bucket with its data and files
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardSuccess"
                  - type: object
                    properties:
                      bucket:
                        $ref: "#/components/schemas/Bucket"
                      data:
                        type: object
                      files:
                        type: array
                        items:
                          type: object

  /api/app/create_bucket/v1:
    post:
      tags: [Buckets]
      summary: Create a bucket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                enabled:
                  type: boolean
                icon:
                  type: string
                notes:
                  type: string
                data:
                  type: object
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardSuccess"
                  - type: object
                    properties:
                      bucket:
                        $ref: "#/components/schemas/Bucket"

  /api/app/update_bucket/v1:
    post:
      tags: [Buckets]
      summary: Update a bucket (partial)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
                title:
                  type: string
                data:
                  type: object
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardSuccess"

  /api/app/write_bucket_data/v1:
    post:
      tags: [Buckets]
      summary: Write (merge) arbitrary data into a bucket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, data]
              properties:
                id:
                  type: string
                data:
                  type: object
                fetch:
                  type: boolean
                  description: If true, return the updated data object in the response
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardSuccess"
                  - type: object
                    properties:
                      data:
                        type: object

  /api/app/upload_bucket_files/v1:
    post:
      tags: [Buckets]
      summary: Upload files to a bucket
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardSuccess"

  /api/app/delete_bucket_file/v1:
    post:
      tags: [Buckets]
      summary: Delete a file from a bucket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, filename]
              properties:
                id:
                  type: string
                filename:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardSuccess"

  /api/app/delete_bucket/v1:
    post:
      tags: [Buckets]
      summary: Delete a bucket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardSuccess"

  # ════════════════════════════════════════════════════════════════
  # CATEGORIES
  # ════════════════════════════════════════════════════════════════
  /api/app/get_categories/v1:
    get:
      tags: [Categories]
      summary: List all categories
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardSuccess"
                  - type: object
                    properties:
                      rows:
                        type: array
                        items:
                          $ref: "#/components/schemas/Category"
                      list:
                        $ref: "#/components/schemas/ListMeta"

  /api/app/get_category/v1:
    get:
      tags: [Categories]
      summary: Get a single category
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardSuccess"
                  - type: object
                    properties:
                      category:
                        $ref: "#/components/schemas/Category"

  /api/app/create_category/v1:
    post:
      tags: [Categories]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Category"
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardSuccess"
                  - type: object
                    properties:
                      category:
                        $ref: "#/components/schemas/Category"

  /api/app/update_category/v1:
    post:
      tags: [Categories]
      summary: Update a category (partial)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardSuccess"

  /api/app/delete_category/v1:
    post:
      tags: [Categories]
      summary: Delete a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardSuccess"

  /api/app/multi_update_category/v1:
    post:
      tags: [Categories]
      summary: Bulk-update category sort order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [id, sort_order]
                    properties:
                      id:
                        type: string
                      sort_order:
                        type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardSuccess"

  # ════════════════════════════════════════════════════════════════
  # CHANNELS
  # ════════════════════════════════════════════════════════════════
  /api/app/get_channels/v1:
    get:
      tags: [Channels]
      summary: List all channels
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardSuccess"
                  - type: object
                    properties:
                      rows:
                        type: array
                        items:
                          $ref: "#/components/schemas/Channel"
                      list:
                        $ref: "#/components/schemas/ListMeta"

  /api/app/get_channel/v1:
    get:
      tags: [Channels]
      summary: Get a single channel
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardSuccess"
                  - type: object
                    properties:
                      channel:
                        $ref: "#/components/schemas/Channel"

  /api/app/create_channel/v1:
    post:
      tags: [Channels]
      summary: Create a notification channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Channel"
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardSuccess"
                  - type: object
                    properties:
                      channel:
                        $ref: "#/components/schemas/Channel"

  /api/app/update_channel/v1:
    post:
      tags: [Channels]
      summary: Update a channel (partial)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardSuccess"

  /api/app/delete_channel/v1:
    post:
      tags: [Channels]
      summary: Delete a channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardSuccess"

  # ════════════════════════════════════════════════════════════════
  # EVENTS
  # ════════════════════════════════════════════════════════════════
  /api/app/get_events/v1:
    get:
      tags: [Events]
      summary: List all events
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardSuccess"
                  - type: object
                    properties:
                      rows:
                        type: array
                        items:
                          $ref: "#/components/schemas/Event"
                      list:
                        $ref: "#/components/schemas/ListMeta"

  /api/app/get_event/v1:
    get:
      tags: [Events]
      summary: Get a single event with its active jobs and queue count
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardSuccess"
                  - type: object
                    properties:
                      event:
                        $ref: "#/components/schemas/Event"
                      jobs:
                        type: array
                        items:
                          $ref: "#/components/schemas/Job"
                      queued:
                        type: integer

  /api/app/get_event_history/v1:
    get:
      tags: [Events]
      summary: Paginated job history for an event
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: offset
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: sort_by
          schema:
            type: string
        - in: query
          name: sort_dir
          schema:
            type: integer
            enum: [-1, 1]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardSuccess"
                  - type: object
                    properties:
                      rows:
                        type: array
                        items:
                          $ref: "#/components/schemas/Job"
                      list:
                        $ref: "#/components/schemas/ListMeta"

  /api/app/create_event/v1:
    post:
      tags: [Events]
      summary: Create an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Event"
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardSuccess"
                  - type: object
                    properties:
                      event:
                        $ref: "#/components/schemas/Event"

  /api/app/update_event/v1:
    post:
      tags: [Events]
      summary: Update an event (partial)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
                update_state:
                  type: object
                  description: Optional state mutation alongside config changes
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardSuccess"
                  - type: object
                    properties:
                      event:
                        $ref: "#/components/schemas/Event"

  /api/app/delete_event/v1:
    post:
      tags: [Events]
      summary: Delete an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
                delete_jobs:
                  type: boolean
                  description: Also delete all associated job history
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardSuccess"

  /api/app/run_event/v1:
    post:
      tags: [Events]
      summary: Trigger an event manually and return the new job ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: Event ID (id or title required)
                title:
                  type: string
                  description: Event title (id or title required)
                params:
                  type: object
                  description: Override event params for this run
                input:
                  type: object
                  description: Structured input data passed to the plugin
                test:
                  type: boolean
                  description: Run in test mode
                tags:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Job created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardSuccess"
                  - type: object
                    properties:
                      id:
                        type: string
                        description: Job ID

  /api/app/magic/v1/{token}:
    get:
      tags: [Events]
      summary: Trigger an event via a magic link token (no API key required)
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
        - in: query
          name: "*"
          description: Any query parameters are forwarded as job params
          schema:
            type: string
      responses:
        "200":
          description: Job created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardSuccess"
                  - type: object
                    properties:
                      id:
                        type: string
