# obsidian
#

services:
  obsidian:
    image: lscr.io/linuxserver/obsidian:v1.12.7-ls121
    container_name: obsidian
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_add:
      - IPC_LOCK
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - CUSTOM_USER=${CUSTOM_USER:-abc}
      - PASSWORD=${PASSWORD}
      - SELKIES_ENCODER=jpeg
      #- DRINODE=/dev/dri/renderD128  # optional: GPU device for rendering
      #- DRI_NODE=/dev/dri/renderD128 # optional: GPU device for encoding
      #- AUTO_GPU=true                # optional: auto-detect first available GPU
    shm_size: "1gb"
    volumes:
      - /home/${USER}/resources/docker/obsidian/appdata/config:/config
      - /mnt/storage/vaults:/vaults
    ports:
      - 3002:3000   # HTTP (KasmVNC)
      - 3003:3001   # HTTPS (KasmVNC) — use this for browser access
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    healthcheck:
      test: ["CMD", "curl", "-sk", "https://localhost:3001"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

